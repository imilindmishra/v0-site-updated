# AWS CodeBuild: build the static export and publish it to S3 + CloudFront.
# BUCKET_NAME and DISTRIBUTION_ID are set on the CodeBuild project by infra/static-site.yaml.
version: 0.2

env:
  secrets-manager:
    NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: iclinic/website/env:NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY
    NEXT_PUBLIC_WHISTLEBLOWER_WEB3FORMS_KEY: iclinic/website/env:NEXT_PUBLIC_WHISTLEBLOWER_WEB3FORMS_KEY

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g pnpm@11
      - pnpm install --frozen-lockfile
  build:
    on-failure: ABORT
    commands:
      - pnpm build
      - test -f out/index.html && test -f out/404.html
  post_build:
    commands:
      # Hashed assets first (immutable), then everything else with short browser TTL
      # (CloudFront keeps it 24h; the invalidation below clears that on every deploy).
      - aws s3 sync out/ "s3://$BUCKET_NAME" --exclude "*" --include "_next/static/*" --cache-control "public,max-age=31536000,immutable"
      - aws s3 sync out/ "s3://$BUCKET_NAME" --delete --exclude "_next/static/*" --cache-control "public,max-age=0,must-revalidate,s-maxage=86400"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
